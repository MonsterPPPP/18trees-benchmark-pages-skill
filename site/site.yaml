findings:
  - title: 数字不许手写进 HTML
    body: 页面里每个数字都来自 data/*.csv，改数字就是改 CSV 再重跑。它只管渲染，不管你的数据对不对——数据合不合理是使用者的判断。
  - title: 分区是开关，不是义务
    body: 基线锚点、口径脚注、提交指引都给配置才渲染，没配的整段不出现，不会留下空框。本 skill 不规定你的 benchmark 该怎么写。
  - title: 一个依赖，零外部 CDN
    body: 只要 PyYAML。表格引擎 Tabulator 以 vendored 形式随站点分发，生成的站点离线可打开，不依赖任何 CDN。

limitations: |
  本 skill 的边界，写在页面上以免被误用：

  - **它不做评测。** 跑模型、跑 prompt 在别处完成，本 skill 只消费评测产物。
  - **它不做数据分析。** 显著性检验、消融、item difficulty 应该在你的分析脚本里算完，本 skill 只把结果渲染成表和图，不现算。
  - **它不做视觉设计。** 版面沿用学术主页的通用惯例，目标是「一眼看出这是个正经 benchmark 页」，不是「好看」。
  - **它只产出静态站。** 需要登录、实时提交、跑代码验证分数的榜单，静态站做不到，得用 HF Spaces 或自建后端。

  许可方面：模板层派生自 Academic Project Page Template 与 Nerfies（均为 CC BY-SA 4.0），
  因此生成出的每个站点 footer 都会带上游回链——这是授权条件，生成器不提供关闭开关。

