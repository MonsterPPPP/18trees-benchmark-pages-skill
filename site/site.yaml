submission:
  enabled: true
  title: 怎么用
  repo: "https://github.com/MonsterPPPP/18trees-benchmark-pages-skill"
  instructions: |
    **安装**（Claude Code）：
    `/plugin marketplace add MonsterPPPP/18trees-benchmark-pages-skill` 然后
    `/plugin install benchmark-pages@18trees-benchmark-pages-skill`

    **三步上手**：

    1. 建一个站点源目录，写 `site.yaml`（本页的配置就是 [`site/site.yaml`](https://github.com/MonsterPPPP/18trees-benchmark-pages-skill/blob/main/site/site.yaml)，
       可以直接照抄）
    2. 把榜单数据放进 `data/leaderboard.csv`——一行一个参赛者，必须含 `model`、`n`、`correct` 和主指标列
    3. 跑 `python scripts/build_site.py --source <源目录> --out _site`

    生成器会校验数据，通过后输出 `_site/`，直接推到 GitHub Pages 即可。

    完整规范见仓库里的 `skills/benchmark-pages/references/`：
    输入契约、榜单列规范、`site.yaml` 全字段、部署与提交流程。

