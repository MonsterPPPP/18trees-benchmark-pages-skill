# ══════════════════════════════════════════════════════════════════
# 这个站点源目录同时承担两个身份：
#
#   1. 本仓库发布到 GitHub Pages 的页面 —— 讲清楚 benchmark-pages 是什么
#   2. skill 的输入格式示例 —— 一份可直接照抄的 site.yaml + data/ 骨架
#
# 页面上那个排行榜不是截图，是用真实评测数据（6 个模型 × 2492 道题）
# 由 scripts/build_site.py 现场渲染的。它就是本 skill 的产出形态。
# ══════════════════════════════════════════════════════════════════

title: benchmark-pages
tagline: 把 benchmark 的实验数据、论文和分析报告，变成一个能托管在 GitHub Pages 上的主页与排行榜

authors:
  - name: 十八木
    url: "https://github.com/MonsterPPPP"

venue: 18trees · AI skill
date: 2026-09-22

base_url: "https://monsterpppp.github.io/18trees-benchmark-pages-skill"
brand_color: "#2F6B4F"

keywords: [benchmark, leaderboard, GitHub Pages, 学术主页, LLM 评测, 静态站生成器]

abstract: |
  benchmark-pages 是一个 skill：给它一份 benchmark 的实验数据、一篇写好的论文和一份分析报告，
  它渲染出一个能直接托管在 GitHub Pages 上的静态站——论文主页负责讲清这个 benchmark 是什么，
  榜单页负责让人横向比较模型。

  你正在看的这一页就是它生成的。下面那个排行榜不是截图，是真实评测数据
  （6 个模型、2492 道四选一题）由 scripts/build_site.py 现场渲染出来的。

  它解决的是一个具体问题：做 benchmark 的人都在 fork 同一个学术主页模板，
  然后手搓 benchmark 特有的部分——表格怎么从实验结果生成、模型更新了榜单怎么改、
  别人怎么把自己的结果加进来。这些"每个人都重做一遍"的部分，本 skill 已经做完了。

  三条设计原则：

  一、页面里每一个数字都来自 data/*.csv。想在页面上改个数字，就去改 CSV 再重跑。
  它只管渲染，不管你的数据对不对——结构性问题（缺列、引用的文件不存在）会挡住，
  数据可信度问题（correct/n 与主指标不一致、分母不整齐）只提示，页面照常产出。

  二、榜单该有的分区都是现成的开关：排序筛选、分维度热力图、置信区间、
  基线锚点、评测口径脚注、结果提交指引。没配的整段不出现。

  三、只有一个依赖（PyYAML）。表格引擎已随仓库分发，生成的站点完全自包含、离线可打开。

